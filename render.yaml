# Web service only — database is external (e.g. Neon).
# After Blueprint deploy, set DATABASE_URL in Render → Environment to your Neon connection string.
# Pick a Neon region close to your Render region (e.g. Oregon → US West).
services:
  - type: web
    name: realtime-testing-dashboard-api
    env: python
    plan: free
    buildCommand: python -m pip install --upgrade pip setuptools wheel && python -m pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      # Pin Python: 3.14+ may lack binary wheels (e.g. pydantic-core) and fall back to Rust builds that fail on Render.
      - key: PYTHON_VERSION
        value: "3.11.9"
      # Paste from Neon → Connection string (postgresql://... or postgres://... both work).
      - key: DATABASE_URL
        sync: false
      # Comma-separated origins. Must match your frontend URL(s) exactly (e.g. https://your-app.vercel.app).
      - key: CORS_ORIGINS
        sync: false
      - key: AUTO_CREATE_SCHEMA
        value: "false"
