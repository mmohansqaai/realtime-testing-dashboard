services:
  - type: web
    name: realtime-testing-dashboard-api
    env: python
    plan: free
    buildCommand: python -m pip install --upgrade pip setuptools wheel && python -m pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      # Pin Python: 3.14+ may lack binary wheels (e.g. pydantic-core) and fall back to Rust builds that fail on Render.
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        fromDatabase:
          name: realtime-testing-dashboard-db
          property: connectionString
      # Comma-separated. Each Vercel project / preview URL must be listed (browsers send exact Origin).
      - key: CORS_ORIGINS
        value: https://realtime-testing-dashboard.vercel.app,https://realtime-testing-dashboard-ooka.vercel.app
      - key: AUTO_CREATE_SCHEMA
        value: "false"
      - key: DATA_SOURCE
        value: github
      # Set in Render dashboard (secrets): GITHUB_CI_TOKEN, GITHUB_CI_REPO (e.g. mmohansqaai/SelfHealingPlaywrightFramework)
      - key: GITHUB_CI_WORKFLOW_FILE
        value: playwright.yml
      - key: GITHUB_CI_DEFAULT_REF
        value: main
databases:
  - name: realtime-testing-dashboard-db
    plan: free
